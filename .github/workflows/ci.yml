name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: nginx 1.31.4
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            axel \
            build-essential \
            ca-certificates \
            cpanminus \
            git \
            liblist-moreutils-perl \
            libtest-base-perl \
            libtest-longstring-perl \
            libtext-diff-perl \
            liburi-perl \
            libwww-perl \
            redis-server \
            wget
          sudo systemctl start redis-server

      - name: Build and test
        env:
          CC: gcc
          NGINX_VERSION: 1.31.4
        run: |
          set -e
          mkdir -p download-cache
          export LUAJIT_PREFIX=/opt/luajit21
          export LUAJIT_LIB=$LUAJIT_PREFIX/lib
          export LD_LIBRARY_PATH=$LUAJIT_LIB:$LD_LIBRARY_PATH
          export LUAJIT_INC=$LUAJIT_PREFIX/include/luajit-2.1
          export LUA_INCLUDE_DIR=$LUAJIT_INC
          export LUA_CMODULE_DIR=/lib
          export JOBS=3
          export NGX_BUILD_JOBS=$JOBS
          git clone https://github.com/openresty/nginx-devel-utils.git
          git clone https://github.com/openresty/ngx_http_redis.git ../ngx_http_redis
          git clone https://github.com/openresty/openresty.git ../openresty
          git clone https://github.com/openresty/no-pool-nginx.git ../no-pool-nginx
          git clone https://github.com/simpl/ngx_devel_kit.git ../ndk-nginx-module
          git clone https://github.com/openresty/test-nginx.git
          git clone -b v2.1-agentzh https://github.com/openresty/luajit2.git
          git clone https://github.com/openresty/lua-nginx-module.git ../lua-nginx-module
          git clone https://github.com/openresty/lua-resty-core.git ../lua-resty-core
          git clone https://github.com/openresty/lua-resty-lrucache.git ../lua-resty-lrucache
          git clone https://github.com/openresty/nginx-eval-module.git ../eval-nginx-module
          git clone https://github.com/openresty/echo-nginx-module.git ../echo-nginx-module
          git clone https://github.com/openresty/set-misc-nginx-module.git ../set-misc-nginx-module
          cd luajit2
          make -j$JOBS CCDEBUG=-g Q= PREFIX=$LUAJIT_PREFIX CC=$CC XCFLAGS='-DLUA_USE_APICHECK -DLUA_USE_ASSERT -msse4.2' > build.log 2>&1 || (cat build.log && exit 1)
          sudo make install PREFIX=$LUAJIT_PREFIX > build.log 2>&1 || (cat build.log && exit 1)
          cd ..
          cpanm --sudo --notest --reinstall Test::Simple
          cpanm --sudo --notest Test::Nginx IPC::Run Test2::Util > build.log 2>&1 || (cat build.log && exit 1)
          cpanm --sudo --verbose ./test-nginx
          export PATH=$PWD/work/nginx/sbin:$PWD/nginx-devel-utils:$PATH
          export NGX_BUILD_CC=$CC
          sh util/build.sh $NGINX_VERSION > build.log 2>&1 || (cat build.log && exit 1)
          nginx -V
          ldd `which nginx`|grep luajit
          prove -r t
